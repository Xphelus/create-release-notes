name: 'create-release-notes'
description: 'Generates release notes from commits between the latest (or specified) tag and the branch HEAD.'
inputs:
    base-ref:
      description: 'Custom base ref'
      required: false
      default: ''
    head-ref:
        description: 'Custom head ref'
        required: false
        default: 'HEAD'
    format:
        description: 'Release note format'
        required: false
        default: '- {{subject}} by @{{author}}'
outputs:
    release-name:
        description: 'Release name'
    release-notes:
        description: 'Release notes'
runs:
    using: 'node16'
    main: 'dist/index.js'
